[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory-vault"
version = "0.2.0"
description = "MCP server that gives any agent persistent memory — namespaced facts with tags, SQLite FTS5 full-text search, TTL expiry and zero external dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alejandro Brito", email = "alejandrobritoolivera@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "claude", "ai-agents", "memory", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
# mcp 1.10 is the first release with tool titles; 2.x renamed FastMCP to
# MCPServer, and server.py supports both. The upper bound keeps a future
# breaking major from being resolved before it has been tested.
dependencies = ["mcp>=1.10,<3", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AleBrito124356/mcp-memory-vault"
Source = "https://github.com/AleBrito124356/mcp-memory-vault"
Issues = "https://github.com/AleBrito124356/mcp-memory-vault/issues"

[project.scripts]
mcp-memory-vault = "mcp_memory_vault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_memory_vault"]
